# .github/workflows/ci.yml

# Continuous Integration (CI) Workflow
name: ci

# This workflow will run whenever we push commits to the `main` branch, or
# whenever there's a pull request to the `main` branch. See:
# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#on
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    # Give your job a name that will show up in the GitHub Actions web UI
    name: ESLint
    # We'll run this on a Linux (Ubuntu) VM, since we'll deploy on Linux too.
    runs-on: ubuntu-latest
    # We run these steps one after the other, and if any fail, we stop the process
    steps:
      # https://github.com/actions/checkout
      - name: Check out code
        uses: actions/checkout@v4

      # https://github.com/actions/setup-node
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          # Use node LTS https://github.com/actions/setup-node#supported-version-syntax
          node-version: 'lts/*'
          # Cache npm dependencies so they don't have to be downloaded next time - https://github.com/actions/setup-node#caching-packages-dependencies
          cache: 'npm'

      - name: Install node dependencies
        # Use `ci` vs. `install`, see https://docs.npmjs.com/cli/v8/commands/npm-ci
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  dockerfile-lint:
    name: dockerfile-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install node dependencies and run Tests
        run: npm install-ci-test

  docker-hub:
    name: Build and push to Docker Hub
    needs: [lint, dockerfile-lint, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: Build and push
        env:
          DOCKERHUB_REPO: alisedighmoghadam/fragments

          SHA_TAG: sha-${{github.sha}}

        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{env.DOCKERHUB_REPO}}:${{env.SHA_TAG}}, ${{env.DOCKERHUB_REPO}}:main, ${{env.DOCKERHUB_REPO}}:latest

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      COMPOSE_LOG_LEVEL: DEBUG
      DOCKER_BUILDKIT: 1
      LOG_LEVEL: debug
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install deps and print versions
        run: |
          set -euxo pipefail
          npm ci
          docker version
          docker compose version

      - name: Build containers (verbose)
        run: |
          set -euxo pipefail
          docker compose build --progress=plain

      - name: Make local-aws-setup.sh executable
        run: chmod +x ./scripts/local-aws-setup.sh

      - name: Start stack (detached) and wait for health
        run: |
          set -euxo pipefail
          # Requires healthchecks in your compose services
          docker compose up -d --wait --wait-timeout 180
          docker compose ps

      - name: Stream logs in background
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          (docker compose logs --follow --timestamps 2>&1 | tee artifacts/compose-live.log) &
          echo $! > logs.pid

      - name: Setup Local AWS Resources
        # NOTE: this file needs to be made executable *before* you check into git:
        # $ chmod +x ./scripts/local-aws-setup.sh
        run: ./scripts/local-aws-setup.sh

      - name: Run Hurl Tests
        run: npm run test:integration

      - name: Collect Docker diagnostics
        if: always()
        run: |
          set -euxo pipefail
          docker compose ps -a > artifacts/compose-ps.txt
          docker compose logs --no-color --timestamps > artifacts/compose-logs.txt || true
          for c in $(docker compose ps -q); do
            NAME=$(docker inspect --format '{{.Name}}' "$c" | tr -d '/')
            docker inspect "$c" > "artifacts/inspect-$NAME.json" || true
          done

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-diagnostics
          path: artifacts/

      - name: Stop log streamer & tear down
        if: always()
        run: |
          set -euxo pipefail
          kill "$(cat logs.pid)" || true
          docker compose down -v
